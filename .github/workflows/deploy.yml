name: Deploy VitePress

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RELEASE_ASSET: site-docs-dist.tar.gz
      DEPLOY_TAG: deploy-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_TARGET: /var/www/main/dist

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run docs:build

      - name: Verify build output
        run: |
          test -f docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist/assets

      - name: Pack build output
        run: |
          printf '%s\n' "${GITHUB_SHA}" > docs/.vitepress/dist/.deploy-sha
          tar -czf "${RELEASE_ASSET}" -C docs/.vitepress/dist .
          sha256sum "${RELEASE_ASSET}" > "${RELEASE_ASSET}.sha256"
          tar -tzf "${RELEASE_ASSET}" >/dev/null
          ls -lh "${RELEASE_ASSET}" "${RELEASE_ASSET}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${DEPLOY_TAG}" \
            "${RELEASE_ASSET}" \
            "${RELEASE_ASSET}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Site Docs Deploy ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Automated deployment package for ${GITHUB_SHA}." \
            --latest

      - name: Upload package to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "site-docs-dist.tar.gz,site-docs-dist.tar.gz.sha256"
          target: "/tmp/site-docs-deploy-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Verify package and update site
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu

            ASSET="${{ env.RELEASE_ASSET }}"
            DEPLOY_TARGET="${{ env.DEPLOY_TARGET }}"
            UPLOAD_DIR="/tmp/site-docs-deploy-${{ github.run_id }}-${{ github.run_attempt }}"

            case "${DEPLOY_TARGET}" in
              ""|"/")
                echo "Invalid DEPLOY_TARGET: ${DEPLOY_TARGET}" >&2
                exit 1
                ;;
            esac

            case "${UPLOAD_DIR}" in
              /tmp/site-docs-deploy-*)
                ;;
              *)
                echo "Invalid UPLOAD_DIR: ${UPLOAD_DIR}" >&2
                exit 1
                ;;
            esac

            TMP_DIR="$(mktemp -d)"
            cleanup() {
              rm -rf "${TMP_DIR}" "${UPLOAD_DIR}"
            }
            trap cleanup EXIT

            test -f "${UPLOAD_DIR}/${ASSET}"
            test -f "${UPLOAD_DIR}/${ASSET}.sha256"
            cd "${UPLOAD_DIR}"
            sha256sum -c "${ASSET}.sha256"

            mkdir -p "${TMP_DIR}/site" "${DEPLOY_TARGET}"
            tar -xzf "${ASSET}" -C "${TMP_DIR}/site"

            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete "${TMP_DIR}/site/" "${DEPLOY_TARGET}/"
            else
              find "${DEPLOY_TARGET}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              cp -a "${TMP_DIR}/site/." "${DEPLOY_TARGET}/"
            fi

            echo "Updated ${DEPLOY_TARGET} to $(cat "${DEPLOY_TARGET}/.deploy-sha")"
