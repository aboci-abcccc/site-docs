name: Deploy VitePress

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RELEASE_ASSET: site-docs-dist.tar.gz
      DEPLOY_TAG: deploy-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_TARGET: /var/www/main/dist

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run docs:build

      - name: Verify build output
        run: |
          test -f docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist/assets

      - name: Pack build output
        run: |
          printf '%s\n' "${GITHUB_SHA}" > docs/.vitepress/dist/.deploy-sha
          tar -czf "${RELEASE_ASSET}" -C docs/.vitepress/dist .
          sha256sum "${RELEASE_ASSET}" > "${RELEASE_ASSET}.sha256"
          tar -tzf "${RELEASE_ASSET}" >/dev/null
          ls -lh "${RELEASE_ASSET}" "${RELEASE_ASSET}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${DEPLOY_TAG}" \
            "${RELEASE_ASSET}" \
            "${RELEASE_ASSET}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Site Docs Deploy ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Automated deployment package for ${GITHUB_SHA}." \
            --latest

      - name: Configure deployment SSH
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 0600 "${HOME}/.ssh/deploy_key"
          timeout 20s ssh-keyscan -T 10 -H "${SSH_HOST}" >> "${HOME}/.ssh/known_hosts"

      - name: Sync changed files to server
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USERNAME }}
        run: |
          set -eu

          RESOLVED_TARGET="$(ssh -i "${HOME}/.ssh/deploy_key" -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" "readlink -f '${DEPLOY_TARGET}'")"
          test "${RESOLVED_TARGET}" = "${DEPLOY_TARGET}"

          rsync -rlptz \
            --checksum \
            --delete-delay \
            --delay-updates \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i ${HOME}/.ssh/deploy_key -o BatchMode=yes" \
            docs/.vitepress/dist/ \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_TARGET}/"

      - name: Verify live site version
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USERNAME }}
        run: |
          set -eu

          LIVE_SHA="$(ssh -i "${HOME}/.ssh/deploy_key" -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" "cat '${DEPLOY_TARGET}/.deploy-sha'")"
          test "${LIVE_SHA}" = "${GITHUB_SHA}"
          echo "Updated ${DEPLOY_TARGET} to ${LIVE_SHA}"
